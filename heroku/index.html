<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUKA-AI | HEROKU DEPLOY</title>  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0b0a12;
      color:white;
      min-height:100vh;
    }

    .top{
      padding:20px 8%;
      background:rgba(255,255,255,0.05);
      border-bottom:1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
    }

    .logo{
      font-size:26px;
      font-weight:bold;
      color:#a855f7;
    }

    .container{
      padding:60px 8%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .card{
      width:100%;
      max-width:600px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      padding:30px;
      border-radius:20px;
      box-shadow:0 0 25px rgba(168,85,247,0.2);
    }

    h1{
      color:#a855f7;
      margin-bottom:10px;
    }

    p{
      color:#cfcfcf;
      margin-bottom:25px;
    }

    label{
      font-size:14px;
      color:#ddd;
    }

    input{
      width:100%;
      padding:14px;
      margin-top:8px;
      margin-bottom:20px;
      border-radius:10px;
      border:none;
      outline:none;
      background:rgba(255,255,255,0.08);
      color:white;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#a855f7;
      color:black;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#9333ea;
    }

    .note{
      font-size:13px;
      color:#aaa;
      margin-top:10px;
    }
  </style></head>
<body>  <div class="top">
    <div class="logo">LUKA-AI <span style="color:white">DEPLOY</span></div>
  </div>  <div class="container">
    <div class="card">
      <h1>Deploy to Heroku 💜</h1>
      <p>Fill in details below to deploy your bot or project</p><form>
    <label>Heroku API Key</label>
    <input type="text" placeholder="Enter your Heroku API Key" />

    <label>App Name</label>
    <input type="text" placeholder="luka-ai-bot" />

    <label>GitHub Repo</label>
    <input type="text" placeholder="lucvoice/LUKA-AI" />
    <div class="note">Example: lucvoice/LUKA-AI</div>

    <button type="submit">
      <i class="fa-brands fa-heroku"></i> Deploy Now
    </button>
  </form>
</div>

  </div></body>
</html>
