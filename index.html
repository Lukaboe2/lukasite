<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI | Deploy to Heroku</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      overflow:hidden;
      transition:.4s;
      background:
      radial-gradient(circle at top left,#7c3aed,#0f172a 40%),
      linear-gradient(135deg,#111827,#020617);
    }

    .glow{
      position:absolute;
      width:300px;
      height:300px;
      background:#9333ea;
      border-radius:50%;
      filter:blur(120px);
      opacity:.35;
    }

    .glow.one{
      top:-80px;
      left:-80px;
    }

    .glow.two{
      bottom:-100px;
      right:-80px;
    }

    .card{
      position:relative;
      z-index:2;
      width:100%;
      max-width:450px;
      padding:35px 25px;
      border-radius:30px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.1);
      backdrop-filter:blur(18px);
      box-shadow:0 10px 40px rgba(0,0,0,.4);
      color:#fff;
      transition:.4s;
    }

    .theme-btn{
      position:absolute;
      top:18px;
      right:18px;
      border:none;
      border-radius:30px;
      padding:8px 14px;
      background:rgba(255,255,255,.1);
      color:#fff;
      cursor:pointer;
      transition:.3s;
      font-size:13px;
    }

    .theme-btn:hover{
      background:#9333ea;
    }

    .avatar{
      width:110px;
      height:110px;
      margin:auto;
      border-radius:50%;
      overflow:hidden;
      border:3px solid #a855f7;
      box-shadow:0 0 25px rgba(168,85,247,.6);
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .title{
      text-align:center;
      margin-top:18px;
      font-size:32px;
      font-weight:700;
      letter-spacing:1px;
    }

    .subtitle{
      text-align:center;
      margin-top:8px;
      color:#cbd5e1;
      font-size:14px;
      line-height:1.6;
    }

    .status{
      margin-top:18px;
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
    }

    .badge{
      padding:8px 14px;
      border-radius:30px;
      font-size:12px;
      background:rgba(168,85,247,.18);
      border:1px solid rgba(168,85,247,.4);
      color:#e9d5ff;
    }

    .form-group{
      margin-top:28px;
    }

    .label{
      display:block;
      margin-bottom:10px;
      color:#ddd6fe;
      font-size:14px;
      font-weight:600;
    }

    .input{
      width:100%;
      padding:15px;
      border:none;
      outline:none;
      border-radius:16px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      font-size:15px;
      transition:.3s;
    }

    .input:focus{
      border-color:#a855f7;
      box-shadow:0 0 15px rgba(168,85,247,.4);
    }

    .input::placeholder{
      color:#94a3b8;
    }

    .fork{
      margin-top:12px;
      font-size:13px;
      color:#cbd5e1;
    }

    .fork a{
      color:#c084fc;
      text-decoration:none;
      font-weight:600;
    }

    .deploy-btn{
      width:100%;
      margin-top:28px;
      padding:16px;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg,#9333ea,#7e22ce);
      color:#fff;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      transition:.3s;
      box-shadow:0 8px 20px rgba(147,51,234,.4);
    }

    .deploy-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(147,51,234,.6);
    }

    .repo-box{
      margin-top:24px;
      padding:16px 18px;
      border-radius:18px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      display:flex;
      justify-content:space-between;
      align-items:center;
      cursor:pointer;
      transition:.3s;
    }

    .repo-box:hover{
      background:rgba(168,85,247,.18);
      transform:scale(1.02);
    }

    .repo-link{
      color:#fff;
      text-decoration:none;
      font-size:14px;
      width:100%;
    }

    .footer{
      margin-top:22px;
      text-align:center;
      color:#94a3b8;
      font-size:12px;
    }

    /* LIGHT MODE */

    body.light-mode{
      background:#f3f4f6;
    }

    body.light-mode .card{
      background:#ffffff;
      color:#111827;
      border:1px solid #d1d5db;
    }

    body.light-mode .subtitle,
    body.light-mode .fork,
    body.light-mode .footer{
      color:#4b5563;
    }

    body.light-mode .label{
      color:#111827;
    }

    body.light-mode .input{
      background:#f9fafb;
      color:#111827;
      border:1px solid #d1d5db;
    }

    body.light-mode .repo-box{
      background:#f9fafb;
      border:1px solid #d1d5db;
    }

    body.light-mode .repo-link{
      color:#111827;
    }

    body.light-mode .theme-btn{
      background:#111827;
      color:#fff;
    }

    @media(max-width:500px){

      .card{
        padding:30px 20px;
      }

      .title{
        font-size:28px;
      }

    }

  </style>
</head>

<body>

  <div class="glow one"></div>
  <div class="glow two"></div>

  <div class="card">

    <button class="theme-btn" onclick="toggleTheme()">
      🌙 Dark
    </button>

    <div class="avatar">
      <img src="https://i.imgur.com/2DhmtJ4.png" alt="LUKA-AI">
    </div>

    <h1 class="title">
      LUKA-AI
    </h1>

    <p class="subtitle">
      Verify your GitHub account and deploy instantly to Heroku ☁️
    </p>

    <div class="status">
      <div class="badge">✅ Verified</div>
      <div class="badge">🚀 Deploy Ready</div>
      <div class="badge">☁️ Heroku</div>
    </div>

    <form onsubmit="handleDeploy(event)">

      <div class="form-group">

        <label class="label">
          🐱 GitHub Username
        </label>

        <input
          type="text"
          class="input"
          id="username"
          placeholder="Enter GitHub username"
          required
        >

        <div class="fork">
          🌿 Fork repository first:
          <a href="https://github.com/lucvoice/LUKA-AI" target="_blank">
            lucvoice/LUKA-AI
          </a>
        </div>

      </div>

      <button type="submit" class="deploy-btn">
        🚀 VERIFY & DEPLOY TO HEROKU
      </button>

    </form>

    <div class="repo-box" onclick="openRepo()">

      <a
        href="https://github.com/lucvoice/LUKA-AI"
        target="_blank"
        class="repo-link"
      >
        github.com/lucvoice/LUKA-AI
      </a>

      <span>➜</span>

    </div>

    <div class="footer">
      💜 LUKA-AI Deployment System
    </div>

  </div>

  <script>

    function toggleTheme(){

      document.body.classList.toggle("light-mode");

      const themeBtn =
      document.querySelector(".theme-btn");

      if(document.body.classList.contains("light-mode")){

        themeBtn.innerHTML = "☀️ Light";

      }else{

        themeBtn.innerHTML = "🌙 Dark";

      }

    }

    function handleDeploy(event){

      event.preventDefault();

      const username =
      document.getElementById("username").value.trim();

      if(username === ""){
        alert("Please enter GitHub username");
        return;
      }

      const deployUrl =
      "https://heroku.com/deploy?template=https://github.com/lucvoice/LUKA-AI";

      window.open(deployUrl, "_blank");

    }

    function openRepo(){

      window.open(
        "https://github.com/lucvoice/LUKA-AI",
        "_blank"
      );

    }

  </script>

</body>
</html>
