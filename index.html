<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI | Deploy to Heroku</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      background:
      radial-gradient(circle at top left,#7c3aed,#0f172a 40%),
      linear-gradient(135deg,#111827,#020617);
      overflow:hidden;
    }

    .glow{
      position:absolute;
      width:300px;
      height:300px;
      background:#9333ea;
      filter:blur(120px);
      opacity:.35;
      border-radius:50%;
      z-index:0;
    }

    .glow.one{
      top:-80px;
      left:-50px;
    }

    .glow.two{
      bottom:-100px;
      right:-50px;
    }

    .card{
      position:relative;
      z-index:1;
      width:100%;
      max-width:450px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(18px);
      border-radius:30px;
      padding:35px 25px;
      color:#fff;
      box-shadow:0 10px 40px rgba(0,0,0,.4);
      animation:fadeIn .8s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .top-btn{
      position:absolute;
      top:18px;
      right:18px;
      border:none;
      background:rgba(255,255,255,.1);
      color:#fff;
      padding:8px 14px;
      border-radius:30px;
      cursor:pointer;
      transition:.3s;
      font-size:13px;
    }

    .top-btn:hover{
      background:#9333ea;
    }

    .avatar{
      width:110px;
      height:110px;
      margin:auto;
      border-radius:50%;
      overflow:hidden;
      border:3px solid #a855f7;
      box-shadow:0 0 25px rgba(168,85,247,.7);
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .title{
      text-align:center;
      margin-top:18px;
      font-size:32px;
      font-weight:700;
      letter-spacing:1px;
    }

    .subtitle{
      text-align:center;
      margin-top:8px;
      color:#cbd5e1;
      font-size:14px;
    }

    .status{
      margin-top:18px;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .badge{
      background:rgba(168,85,247,.18);
      border:1px solid rgba(168,85,247,.4);
      padding:8px 14px;
      border-radius:30px;
      font-size:12px;
      color:#e9d5ff;
    }

    .form-group{
      margin-top:28px;
    }

    .label{
      margin-bottom:10px;
      display:block;
      font-size:14px;
      color:#ddd6fe;
      font-weight:600;
    }

    .input{
      width:100%;
      padding:15px;
      border:none;
      border-radius:16px;
      outline:none;
      background:rgba(255,255,255,.08);
      color:#fff;
      font-size:15px;
      border:1px solid rgba(255,255,255,.08);
      transition:.3s;
    }

    .input:focus{
      border-color:#a855f7;
      box-shadow:0 0 15px rgba(168,85,247,.3);
    }

    .input::placeholder{
      color:#94a3b8;
    }

    .fork{
      margin-top:12px;
      font-size:13px;
      color:#cbd5e1;
    }

    .fork a{
      color:#c084fc;
      text-decoration:none;
      font-weight:600;
    }

    .deploy-btn{
      width:100%;
      margin-top:28px;
      padding:16px;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg,#9333ea,#7e22ce);
      color:#fff;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      transition:.3s;
      box-shadow:0 8px 20px rgba(147,51,234,.4);
    }

    .deploy-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(147,51,234,.6);
    }

    .repo-box{
      margin-top:22px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      padding:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .repo-box a{
      color:#fff;
      text-decoration:none;
      font-size:14px;
    }

    .footer{
      text-align:center;
      margin-top:22px;
      color:#94a3b8;
      font-size:12px;
    }

    @media(max-width:500px){
      .card{
        padding:30px 20px;
      }

      .title{
        font-size:28px;
      }
    }
  </style>
</head>
<body>

  <div class="glow one"></div>
  <div class="glow two"></div>

  <div class="card">

    <button class="top-btn" onclick="toggleTheme()">
      🌙 Theme
    </button>

    <div class="avatar">
      <img src="https://files.catbox.moe/1l02sd.png" alt="LUKA-AI">
    </div>

    <h1 class="title">LUKA-AI</h1>

    <p class="subtitle">
      Verify your GitHub account and deploy instantly to Heroku ☁️
    </p>

    <div class="status">
      <div class="badge">✅ Verified</div>
      <div class="badge">🚀 Deploy Ready</div>
      <div class="badge">☁️ Heroku</div>
    </div>

    <form onsubmit="handleDeploy(event)">

      <div class="form-group">
        <label class="label">
          🐱 GitHub Username
        </label>

        <input
          type="text"
          id="username"
          class="input"
          placeholder="Enter GitHub username"
          required
        >

        <div class="fork">
          🌿 Fork repository first:
          <a href="https://github.com/lucvoice/LUKA-AI" target="_blank">
            lucvoice/LUKA-AI
          </a>
        </div>
      </div>

      <button type="submit" class="deploy-btn">
        🚀 VERIFY & DEPLOY TO HEROKU
      </button>

    </form>

    <div class="repo-box">
      <a href="https://github.com/lucvoice/LUKA-AI" target="_blank">
        github.com/lucvoice/LUKA-AI
      </a>

      <span>➜</span>
    </div>

    <div class="footer">
      💜 LUKA-AI Deployment System
    </div>

  </div>

  <script>

    function handleDeploy(event){
      event.preventDefault();

      const username =
      document.getElementById("username").value.trim();

      if(username === ""){
        alert("Please enter GitHub username");
        return;
      }

      // HEROKU DEPLOY BUTTON
      const deployUrl =
      "https://heroku.com/deploy?template=https://github.com/lucvoice/LUKA-AI";

      window.open(deployUrl, "_blank");
    }

    function toggleTheme(){
      document.body.classList.toggle("light");

      if(document.body.classList.contains("light")){
        document.body.style.background =
        "#f3f4f6";

        document.querySelector(".card").style.color =
        "#111";
      }else{
        location.reload();
      }
    }

  </script>

</body>
</html>
