<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI Deployment</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

  <style>
    body {
      font-family: sans-serif;
      transition: 0.3s;
    }

    .dark {
      background: #0f172a;
      color: white;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .dark .card {
      background: #111827;
      color: white;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ccc;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 30px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      background: #22c55e;
      color: white;
    }

    .btn:disabled {
      background: gray;
      cursor: not-allowed;
    }
  </style>
</head>

<body id="body" class="flex items-center justify-center min-h-screen bg-slate-100">

  <div class="card w-full max-w-md">

    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2>🚀 LUKA-AI</h2>

      <button onclick="toggleDark()" style="padding:6px 12px;border-radius:20px;border:1px solid #ccc;">
        🌙 Theme
      </button>
    </div>

    <p style="margin-top:10px;color:gray;">Deploy system</p>

    <div style="margin-top:20px;">
      <label>GitHub Username</label>
      <input id="github" type="text" placeholder="octocat" />
    </div>

    <button id="deployBtn" class="btn" disabled>
      🚀 VERIFY & DEPLOY
    </button>

    <p style="margin-top:15px;font-size:12px;color:gray;">
      github.com/LUKA-AI
    </p>

  </div>

<script>
  const body = document.getElementById("body");
  const input = document.getElementById("github");
  const btn = document.getElementById("deployBtn");

  function toggleDark() {
    body.classList.toggle("dark");
  }

  input.addEventListener("input", () => {
    if (input.value.trim().length > 0) {
      btn.disabled = false;
    } else {
      btn.disabled = true;
    }
  });

  btn.addEventListener("click", () => {
    alert("Deploying LUKA-AI for: " + input.value);
  });
</script>

</body>
</html>
