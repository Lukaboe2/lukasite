<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI | CYBER DEPLOY</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #1e0b3b, #05010a);
    }

    .glass {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(168,85,247,0.25);
    }

    .glow {
      box-shadow: 0 0 25px rgba(168,85,247,0.35);
    }

    .neon-text {
      text-shadow: 0 0 12px rgba(168,85,247,0.8);
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(168,85,247,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168,85,247,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.35;
      z-index: 0;
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen text-white p-4">

  <div class="grid-bg"></div>

  <div class="glass glow relative z-10 w-full max-w-md rounded-3xl p-6 text-center">

    <h1 class="text-xl font-bold neon-text">LUKA-AI DEPLOY SYSTEM</h1>

    <p class="text-xs text-purple-300 mt-1">GitHub → Heroku Launcher</p>

    <div class="mt-5">
      <input
        id="username"
        type="text"
        placeholder="Enter GitHub username..."
        class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 focus:ring-2 focus:ring-purple-500 outline-none"
      />
    </div>

    <button
      onclick="deploy()"
      class="w-full mt-5 py-3 rounded-full bg-gradient-to-r from-purple-600 to-indigo-500 font-bold hover:scale-105 transition"
    >
      🚀 DEPLOY NOW
    </button>

    <div class="mt-5 p-3 rounded-xl bg-white/5 border border-white/10 text-left text-xs" id="log">
      <div>🟣 System ready...</div>
    </div>

    <p class="text-[10px] text-purple-300 mt-6 border-t border-white/10 pt-3">
      🛡️ CYBER SYSTEM ACTIVE
    </p>

  </div>

  <script>
    const logBox = document.getElementById("log");

    function log(msg) {
      const div = document.createElement("div");
      div.textContent = msg;
      logBox.appendChild(div);
    }

    function deploy() {
      const user = document.getElementById("username").value.trim();

      if (!user) {
        log("❌ Enter GitHub username");
        alert("Enter GitHub username");
        return;
      }

      const url = `https://heroku.com/deploy?template=https://github.com/${user}/LUKA-AI`;

      log("🚀 Opening deploy page...");
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
