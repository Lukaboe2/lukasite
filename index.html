<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI | CYBER DEPLOY</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #120018, #05010a);
      overflow: hidden;
      color: #fff;
    }

    /* cyber grid */
    body::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(187,0,255,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(187,0,255,0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: moveGrid 10s linear infinite;
      opacity: 0.4;
    }

    @keyframes moveGrid {
      from { transform: translate(0,0); }
      to { transform: translate(50px,50px); }
    }

    /* glow orbs */
    .orb {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(120px);
      background: #bb00ff;
      top: 10%;
      left: 10%;
      animation: float 6s infinite ease-in-out;
    }

    .orb2 {
      background: #6a00ff;
      top: 60%;
      left: 60%;
      animation-delay: 2s;
    }

    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(40px); }
    }

    /* card */
    .card {
      position: relative;
      z-index: 10;
      width: 380px;
      padding: 30px;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(187,0,255,0.3);
      box-shadow: 0 0 40px rgba(187,0,255,0.25);
      text-align: center;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      background: linear-gradient(90deg, #bb00ff, #6a00ff, #ff00ff);
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: 2px;
      text-shadow: 0 0 20px #bb00ff;
    }

    .tag {
      font-size: 11px;
      color: #c9b3e6;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(187,0,255,0.3);
      background: rgba(0,0,0,0.4);
      color: white;
      outline: none;
      margin-top: 10px;
    }

    input:focus {
      border-color: #bb00ff;
      box-shadow: 0 0 10px #bb00ff;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(90deg, #bb00ff, #6a00ff);
      transition: 0.3s;
      box-shadow: 0 0 15px #bb00ff;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px #bb00ff;
    }

    a {
      display: block;
      margin-top: 15px;
      font-size: 11px;
      color: #c9b3e6;
      text-decoration: none;
    }

    .footer {
      margin-top: 18px;
      font-size: 10px;
      opacity: 0.6;
    }

    .status {
      font-size: 10px;
      margin-top: 10px;
      color: #bb00ff;
    }
  </style>
</head>

<body>

  <div class="orb"></div>
  <div class="orb orb2"></div>

  <div class="card">

    <div class="title">LUKA-AI</div>
    <div class="tag">CYBER DEPLOY SYSTEM // v3.0</div>

    <input id="github" type="text" placeholder="GITHUB USERNAME">

    <button onclick="deploy()">⚡ INITIATE DEPLOY</button>

    <a href="https://github.com/lucvoice/LUKA-AI" target="_blank">
      ACCESS REPOSITORY →
    </a>

    <div class="status">SYSTEM: ONLINE ⚡ READY</div>

    <div class="footer">
      © 2026 LUKA-AI CYBER CORE
    </div>

  </div>

  <script>
    function deploy() {
      const user = document.getElementById("github").value.trim();

      if (!user) {
        alert("ENTER USERNAME");
        return;
      }

      const url = `https://heroku.com/deploy?template=https://github.com/${user}/LUKA-AI`;
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
