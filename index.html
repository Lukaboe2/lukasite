<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUKA-AI Deployment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .btn-outline {
            border: 2px solid #10b981;
            color: #10b981;
            transition: all 0.3s ease;
        }
        .btn-outline:hover {
            background-color: #10b981;
            color: white;
        }
        .input-field {
            background-color: #f8fafc;
            border-radius: 1rem;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="card w-full max-w-md p-8 relative">
        <!-- Dark Mode Toggle -->
        <div class="absolute top-6 right-6">
            <button class="flex items-center space-x-2 bg-green-50 text-green-700 px-3 py-1 rounded-full text-sm font-medium border border-green-200">
                <i class="fas fa-palette"></i>
                <span>dark mode</span>
            </button>
        </div>

        <!-- Profile Section -->
        <div class="flex flex-col items-center mt-4">
            <div class="w-24 h-24 rounded-full border-4 border-green-500 p-1 mb-4">
                <img src="https://via.placeholder.com/150" alt="LUKA-AI Logo" class="w-full h-full rounded-full object-cover">
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-1">LUKA-AI</h1>
            <div class="flex items-center space-x-2 text-slate-500 text-sm">
                <i class="fas fa-check-circle text-green-500"></i>
                <span>verify · deploy · heroku</span>
                <i class="fas fa-cloud-upload-alt text-green-500"></i>
            </div>
        </div>

        <!-- Form Section -->
        <div class="mt-8 space-y-6">
            <div>
                <label class="flex items-center text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
                    <i class="fab fa-github mr-2 text-lg"></i> GITHUB USERNAME
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" placeholder="e.g. octocat" class="input-field w-full pl-10 pr-4 py-4 focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <p class="text-xs text-slate-500 mt-2 ml-1">
                    <i class="fas fa-code-branch mr-1 text-green-500"></i> must fork 
                    <a href="#" class="text-green-600 font-medium underline">your-repo/LUKA-AI</a>
                </p>
            </div>

            <div class="flex justify-end">
                <button class="bg-green-100 text-green-700 px-4 py-1 rounded text-xs font-semibold">
                    deploy via Heroku
                </button>
            </div>

            <!-- Main Action Button -->
            <button class="btn-outline w-full py-4 rounded-full font-bold flex items-center justify-center space-x-2 text-lg">
                <i class="fas fa-rocket"></i>
                <span>VERIFY & DEPLOY TO HEROKU</span>
            </button>

            <!-- Link Bar -->
            <div class="bg-slate-50 border border-slate-200 rounded-full p-2 flex items-center justify-between">
                <div class="flex items-center space-x-3 ml-2">
                    <div class="bg-white p-1.5 rounded-full shadow-sm">
                        <i class="fab fa-github text-xl"></i>
                    </div>
                    <span class="text-sm text-slate-600 font-medium">github.com/LUKA-AI</span>
                </div>
                <button class="mr-2 text-slate-400 hover:text-slate-600">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-400 flex items-center justify-center">
                <i class="fas fa-shield-alt mr-2"></i> theme switch · green success
            </p>
        </div>
    </div>

</body>
</html>
