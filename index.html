<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI | PRO DEPLOY</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #2e1065, #0b0b1a);
    }

    .glass {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .glow {
      box-shadow: 0 0 20px rgba(168,85,247,0.6);
    }

    .neon-text {
      text-shadow: 0 0 10px rgba(168,85,247,0.9);
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 text-white">

  <!-- CARD -->
  <div class="glass glow rounded-3xl p-6 w-full max-w-md text-center relative">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="font-bold text-lg neon-text">LUKA-AI</h1>
      <button onclick="toggleDark()" class="text-xs px-3 py-1 rounded-full bg-purple-600 hover:bg-purple-500 transition">
        🌙 Mode
      </button>
    </div>

    <!-- LOGO -->
    <div class="flex justify-center mb-4">
      <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-black text-2xl glow">
        L
      </div>
    </div>

    <p class="text-purple-200 text-xs mb-6">⚡ Deploy • Verify • Run AI Bot</p>

    <!-- INPUT -->
    <div class="text-left">
      <label class="text-xs text-purple-300">GitHub Username</label>

      <input
        id="github-username"
        type="text"
        placeholder="e.g. lucvoice"
        class="w-full mt-2 px-4 py-3 rounded-xl bg-white/10 border border-white/10 focus:outline-none focus:ring-2 focus:ring-purple-500 text-white"
      />

      <p class="text-[11px] text-purple-300 mt-2">
        🌿 Fork required: <span class="text-purple-200 font-mono">LUKA-AI</span>
      </p>
    </div>

    <!-- BUTTON -->
    <button
      onclick="deploy()"
      class="mt-6 w-full py-3 rounded-full bg-gradient-to-r from-purple-600 to-indigo-500 font-bold hover:scale-105 transition glow"
    >
      🚀 DEPLOY NOW
    </button>

    <!-- LINK -->
    <a
      href="https://github.com/lucvoice/LUKA-AI"
      target="_blank"
      class="mt-4 block text-xs text-purple-200 hover:text-white transition"
    >
      Open GitHub Repository →
    </a>

    <p class="text-[10px] text-purple-400 mt-6">
      🔐 Secure • Fast • Heroku Ready
    </p>
  </div>

  <script>
    function deploy() {
      const user = document.getElementById("github-username").value.trim();

      if (!user) {
        alert("https://github.com/lucvoice/LUKA-AI");
        return;
      }

      const url = `https://heroku.com/deploy?template=https://github.com/lucvoice/LUKA-AI`;
      window.open(url, "_blank");
    }

    function toggleDark() {
      alert("Dark mode tayari iko cyber-purple 😎");
    }
  </script>

</body>
</html>
