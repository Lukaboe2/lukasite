<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUKA-AI - Deploy to Heroku</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-sub: #6c757d;
            --border-color: #dee2e6;
            --input-bg: #f8f9fa;
        }

        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --text-main: #f8f9fa;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --input-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            padding: 30px 24px;
            text-align: center;
            position: relative;
        }

        .dark-mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #eaf7ed;
            color: #198754;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        [data-theme="dark"] .dark-mode-toggle {
            background: #1e293b;
            color: #34d399;
        }

        .avatar-container {
            margin: 20px auto 15px;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #198754;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.2);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-name {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .status-links {
            display: flex;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-sub);
            align-items: center;
            margin-bottom: 30px;
        }

        .status-links span.dot {
            color: #198754;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            background-color: var(--input-bg);
            color: var(--text-main);
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #198754;
        }

        .fork-instruction {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 12px;
        }

        .fork-link {
            color: #dc3545;
            text-decoration: none;
            font-weight: 600;
        }

        .deploy-via {
            text-align: right;
            margin-bottom: 20px;
        }

        .deploy-via-badge {
            background-color: #eaf7ed;
            color: #198754;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            font-weight: 500;
        }

        [data-theme="dark"] .deploy-via-badge {
            background-color: rgba(25, 135, 84, 0.2);
            color: #34d399;
        }

        .btn-deploy {
            width: 100%;
            background-color: transparent;
            color: #198754;
            border: 2px solid #198754;
            padding: 14px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
        }

        .btn-deploy:hover {
            background-color: #198754;
            color: #ffffff;
        }

        .github-repo-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 12px 20px;
            background-color: var(--card-bg);
            margin-bottom: 25px;
        }

        .repo-url {
            font-size: 14px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-text {
            font-size: 12px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="card">
        <button class="dark-mode-toggle" id="themeBtn">🎨 dark mode</button>

        <div class="avatar-container">
            <img src="catbox.moe" alt="LUKA-AI Logo">
        </div>

        <div class="brand-name">LUKA-AI</div>
        
        <div class="status-links">
            <span class="dot">●</span> verify · deploy · heroku ☁
        </div>

        <form onsubmit="handleDeploy(event)">
            <div class="form-group">
                <label class="form-label">🐱 GitHub Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="e.g. octocat" required>
                </div>
                <div class="fork-instruction">
                    🌿 must fork <a href="github.com" target="_blank" class="fork-link">lucvoice/LUKA-AI</a>
                </div>
            </div>

            <div class="deploy-via">
                <span class="deploy-via-badge">deploy via Heroku</span>
            </div>

            <button type="submit" class="btn-deploy">🚀 Verify & Deploy to Heroku</button>
        </form>

        <div class="github-repo-box">
            <a href="github.com" target="_blank" class="repo-url">github.com</a>
            <span style="color: var(--text-main);">➜</span>
        </div>

        <div class="footer-text">
            🛡 theme switch · green success
        </div>
    </div>

    <script>
        // Theme switcher functionality
        const themeBtn = document.getElementById('themeBtn');
        
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        themeBtn.addEventListener('click', () => {
            let currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        // Heroku routing logic
        function handleDeploy(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            if(username) {
                // Dynamically triggers deployment setup pointing directly to the user's fork
                const herokuDeployUrl = `heroku.com{username}/LUKA-AI`;
                window.open(herokuDeployUrl, '_blank');
            }
        }
    </script>

</body>
</html>
