<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUKA-AI Deployer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f0f4f8; font-family: sans-serif; }
        .card { background: white; border-radius: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-outline { border: 2px solid #10b981; color: #10b981; transition: 0.3s; }
        .btn-outline:hover { background-color: #10b981; color: white; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="card w-full max-w-md p-8">
        <!-- Profile -->
        <div class="flex flex-col items-center">
            <div class="w-24 h-24 rounded-full border-4 border-green-500 mb-4 overflow-hidden">
                <img src="https://via.placeholder.com/150" alt="LUKA-AI">
            </div>
            <h1 class="text-3xl font-bold text-slate-800">LUKA-AI</h1>
            <p class="text-slate-500 text-sm mt-1">
                <i class="fas fa-check-circle text-green-500"></i> verify · deploy · heroku
            </p>
        </div>

        <!-- Input -->
        <div class="mt-8 space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-2">GITHUB USERNAME</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" id="githubRepo" placeholder="Ingiza jina lako la GitHub" 
                           class="w-full pl-10 pr-4 py-4 bg-slate-50 border border-transparent rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
            </div>

            <!-- Action Button -->
            <button onclick="deployNow()" class="btn-outline w-full py-4 rounded-full font-bold flex items-center justify-center space-x-2 text-lg">
                <i class="fas fa-rocket"></i>
                <span>VERIFY & DEPLOY TO HEROKU</span>
            </button>
        </div>

        <div class="mt-6 text-center">
            <p class="text-xs text-slate-400 italic">Hakikisha ume-fork repository ya LUKA-AI kwanza.</p>
        </div>
    </div>

    <script>
        function deployNow() {
            const repoName = document.getElementById('githubRepo').value.trim();
            
            if (repoName === "") {
                alert("Tafadhali ingiza jina lako la GitHub kwanza!");
                return;
            }

            // Hii ndiyo link inayofanya kazi ya ku-deploy Heroku
            // Badilisha 'LUKA-AI' hapa chini iwe jina halisi la folder la bot kwenye GitHub
            const herokuUrl = `https://dashboard.heroku.com/new?template=https://github.com/${repoName}/LUKA-AI`;
            
            // Inafungua tab mpya ya ku-deploy
            window.open(herokuUrl, '_blank');
        }
    </script>
</body>
</html>
