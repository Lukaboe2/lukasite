<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI • HEROKU DEPLOY</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    *{
      transition:0.3s;
      font-family: sans-serif;
    }

    body{
      background:#eef1f4;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:white;
      border-radius:35px;
      padding:30px;
      box-shadow:0 15px 40px rgba(0,0,0,0.08);
      position:relative;
    }

    .dark body{
      background:#0f172a;
    }

    .dark .card{
      background:#111827;
      color:white;
    }

    .toggle-btn{
      position:absolute;
      top:25px;
      right:25px;
      border:2px solid #8b5cf6;
      color:#8b5cf6;
      padding:10px 20px;
      border-radius:30px;
      cursor:pointer;
      font-weight:bold;
      display:flex;
      align-items:center;
      gap:10px;
      background:transparent;
    }

    .logo{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      border:5px solid #8b5cf6;
      display:block;
      margin:auto;
      margin-top:40px;
    }

    .title{
      text-align:center;
      margin-top:20px;
      font-size:55px;
      font-weight:800;
      color:#111827;
    }

    .dark .title{
      color:white;
    }

    .subtitle{
      text-align:center;
      color:#6b7280;
      margin-top:-10px;
      font-size:20px;
    }

    hr{
      margin:30px 0;
      border:none;
      height:1px;
      background:#ddd;
    }

    .label{
      font-weight:700;
      font-size:20px;
      margin-bottom:10px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .input{
      width:100%;
      border:none;
      background:#f3f4f6;
      padding:18px;
      border-radius:20px;
      font-size:18px;
      outline:none;
      margin-bottom:15px;
    }

    .dark .input{
      background:#1f2937;
      color:white;
    }

    .fork{
      display:flex;
      align-items:center;
      gap:10px;
      color:#6b7280;
      margin-bottom:20px;
      font-size:17px;
    }

    .fork span{
      color:#8b5cf6;
      font-weight:bold;
    }

    .deploy-small{
      width:100%;
      border:none;
      background:#ede9fe;
      color:#6d28d9;
      padding:14px;
      border-radius:20px;
      font-size:20px;
      font-weight:bold;
      cursor:pointer;
      margin-bottom:25px;
    }

    .main-btn{
      width:100%;
      padding:22px;
      border-radius:50px;
      border:3px solid #8b5cf6;
      background:white;
      color:#6d28d9;
      font-size:24px;
      font-weight:800;
      cursor:pointer;
    }

    .main-btn:hover{
      background:#8b5cf6;
      color:white;
    }

    .dark .main-btn{
      background:#111827;
    }

    .github-box{
      margin-top:35px;
      background:#f5f3ff;
      border-radius:30px;
      padding:18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .dark .github-box{
      background:#1f2937;
    }

    .github-link{
      background:white;
      padding:12px 18px;
      border-radius:30px;
      flex:1;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .dark .github-link{
      background:#111827;
    }

    .footer{
      text-align:center;
      margin-top:25px;
      color:#9ca3af;
      font-size:17px;
    }
  </style>
</head>
<body>

  <div class="card">

    <button class="toggle-btn" onclick="toggleDark()">
      <i class="fas fa-palette"></i>
      dark mode
    </button>

    <img
      src="https://i.imgur.com/8Km9tLL.jpg"
      class="logo"
    />

    <h1 class="title">LUKA</h1>

    <p class="subtitle">
      ✅ verify • deploy • heroku ☁️
    </p>

    <hr>

    <div class="label">
      <i class="fab fa-github"></i>
      GITHUB USERNAME
    </div>

    <input
      type="text"
      class="input"
      placeholder="e.g. lucvoice"
      id="username"
    />

    <div class="fork">
      <i class="fas fa-code-branch"></i>
      must fork
      <span>lucvoice/LUKA-AI</span>
    </div>

    <button class="deploy-small">
      deploy via Heroku
    </button>

    <button class="main-btn" onclick="deploy()">
      🚀 VERIFY & DEPLOY TO HEROKU
    </button>

    <div class="github-box">
      <i class="fab fa-github fa-2x"></i>

      <div class="github-link">
        github.com/lucvoice/LUKA-AI
      </div>

      <i class="fas fa-arrow-right fa-2x"></i>
    </div>

    <hr>

    <div class="footer">
      🛡️ theme switch • purple success
    </div>

  </div>

  <script>
    function toggleDark(){
      document.body.classList.toggle("dark");
    }

    function deploy(){
      let user = document.getElementById("username").value;

      if(user === ""){
        alert("Enter GitHub username");
        return;
      }

      window.open(
        "https://heroku.com/deploy?template=https://github.com/lucvoice/LUKA-AI",
        "_blank"
      );
    }
  </script>

</body>
</html>
