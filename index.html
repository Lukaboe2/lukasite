<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI Deployer</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-purple-50 flex items-center justify-center min-h-screen p-4 transition-all duration-300" id="body">

  <!-- Card -->
  <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-md border border-purple-100 relative text-center">

    <!-- Dark Mode Button -->
    <button onclick="toggleDarkMode()" class="absolute top-4 right-4 bg-purple-50 text-purple-600 text-xs px-3 py-1.5 rounded-full border border-purple-200 hover:bg-purple-100 transition">
      🎨 Dark Mode
    </button>

    <!-- Logo -->
    <div class="flex justify-center mt-6">
      <div class="w-24 h-24 rounded-full flex items-center justify-center bg-gradient-to-tr from-purple-900 to-indigo-700 text-white font-black text-2xl shadow-md">
        LUKA
      </div>
    </div>

    <h1 class="text-2xl font-bold text-slate-800 mt-4">LUKA-AI</h1>
    <p class="text-xs text-purple-600 font-medium mt-1">✓ verify · deploy · heroku ☁</p>

    <!-- Form -->
    <div class="mt-6 text-left">
      <label class="text-xs font-bold text-slate-600 block mb-2">
        🐱 GitHub Username
      </label>

      <input
        type="text"
        id="github-username"
        placeholder="e.g. octocat"
        class="w-full bg-slate-50 text-slate-700 text-sm rounded-xl px-4 py-3 border border-slate-200 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none"
      />

      <p class="text-xs text-purple-600 mt-3">
        🌿 Must fork <span class="font-mono text-gray-500">lucvoice/LUKA-AI</span>
      </p>
    </div>

    <!-- Deploy Button -->
    <button
      onclick="handleDeploy()"
      class="w-full mt-6 bg-white text-purple-600 border-2 border-purple-500 rounded-full py-3 font-bold hover:bg-purple-50 transition"
    >
      🚀 VERIFY & DEPLOY TO HEROKU
    </button>

    <!-- GitHub Link -->
    <a
      href="https://github.com/lucvoice/LUKA-AI"
      target="_blank"
      class="mt-4 flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-sm text-gray-600 hover:bg-gray-100 transition"
    >
      <span class="font-mono text-xs">GitHub Repo</span>
      <span>➜</span>
    </a>

    <p class="text-[10px] text-gray-400 mt-6 border-t pt-3">
      🛡️ LUKA-AI Deploy System
    </p>

  </div>

  <!-- JS -->
  <script>
    function handleDeploy() {
      const username = document.getElementById("github-username").value.trim();

      if (!username) {
        alert("Please enter your GitHub username!");
        return;
      }

      const url = `https://heroku.com/deploy?template=https://github.com/${username}/LUKA-AI`;
      window.open(url, "_blank");
    }

    function toggleDarkMode() {
      const body = document.getElementById("body");

      if (body.classList.contains("bg-purple-50")) {
        body.classList.remove("bg-purple-50");
        body.classList.add("bg-slate-900");
      } else {
        body.classList.remove("bg-slate-900");
        body.classList.add("bg-purple-50");
      }
    }
  </script>

</body>
</html>
