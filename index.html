<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUKA-AI Deployer</title>
    <!-- Tailwind CSS Link via cdnjs -->
    <script src="cloudflare.com"></script>
</head>
<body class="bg-purple-50 flex items-center justify-center min-h-screen p-4">

    <!-- Main Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-md border border-purple-100 relative text-center">
        
        <!-- Dark Mode Button -->
        <button class="absolute top-4 right-4 bg-purple-50 text-purple-600 text-xs px-3 py-1.5 rounded-full border border-purple-200 flex items-center gap-1 font-medium hover:bg-purple-100 transition">
            🎨 dark mode
        </button>

        <!-- Profile Avatar (LUKA-AI Branding) -->
        <div class="flex justify-center mt-6">
            <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-purple-600 shadow-md flex items-center justify-center bg-gradient-to-tr from-purple-900 to-indigo-700 text-white font-black text-2xl tracking-wider">
                LUKA
            </div>
        </div>

        <!-- Name and Status -->
        <h1 class="text-2xl font-bold text-slate-800 mt-4">LUKA-AI</h1>
        <p class="text-xs text-purple-600 font-medium mt-1 flex items-center justify-center gap-1">
            ✓ verify · deploy · heroku ☁
        </p>

        <!-- Form Section -->
        <div class="mt-6 text-left">
            <label class="text-xs font-bold text-slate-600 tracking-wider block mb-2">
                🐱 GITHUB USERNAME
            </label>
            
            <!-- Input Field -->
            <div class="relative mb-3">
                <input type="text" id="github-username" placeholder="e.g. octocat" class="w-full bg-slate-50 text-slate-700 text-sm rounded-xl pl-4 pr-4 py-3 border border-slate-200 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
            </div>

            <!-- Fork Requirement -->
            <p class="text-xs text-purple-600 font-medium mb-4">
                🌿 must fork <span class="text-gray-500 font-mono">lucvoice/LUKA-AI</span>
            </p>
        </div>

        <!-- Upper Deploy Tag -->
        <div class="flex justify-end mb-4">
            <span class="text-[10px] bg-purple-50 text-purple-700 px-3 py-1 rounded-full font-medium border border-purple-100">
                deploy via Heroku
            </span>
        </div>

        <!-- Action Button -->
        <button onclick="handleDeploy()" class="w-full bg-white text-purple-600 hover:bg-purple-50 border-2 border-purple-500 rounded-full py-3 font-bold text-sm tracking-wide transition duration-200 shadow-sm mb-4">
            🚀 VERIFY & DEPLOY TO HEROKU
        </button>

        <!-- GitHub Repository Link -->
        <a href="github.com" target="_blank" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 flex items-center justify-between text-sm text-gray-600 hover:bg-gray-100 transition">
            <div class="flex items-center gap-2 font-mono text-xs">
                <span>github.com</span>
            </div>
            <span class="text-slate-400">➜</span>
        </a>

        <!-- Footer Notes -->
        <div class="mt-6 pt-4 border-t border-slate-100">
            <p class="text-[10px] text-gray-400 font-medium">
                🛡️ theme switch · purple success
            </p>
        </div>

    </div>

    <!-- JavaScript Linkage to Heroku -->
    <script>
        function handleDeploy() {
            const username = document.getElementById('github-username').value.trim();
            
            if(!username) {
                alert('Please enter your GitHub Username first!');
                return;
            }
            
            // Generates the Heroku template deployment URL dynamically
            const herokuDeployUrl = `heroku.com{username}/LUKA-AI`;
            
            // Opens the Heroku deployment screen in a new window
            window.open(herokuDeployUrl, '_blank');
        }
    </script>

</body>
</html>
