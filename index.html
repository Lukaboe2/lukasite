<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI | CYBER DEPLOY</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #2e1065, #05010a);
    }

    .glass {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(168,85,247,0.25);
    }

    .glow {
      box-shadow: 0 0 25px rgba(168,85,247,0.35);
    }

    .neon-text {
      text-shadow: 0 0 12px rgba(168,85,247,0.8);
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(168,85,247,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168,85,247,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      opacity: 0.4;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid #a855f7;
      box-shadow: 0 0 15px rgba(168,85,247,0.6);
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 text-white relative">

  <!-- GRID -->
  <div class="grid-bg"></div>

  <!-- CARD -->
  <div class="glass glow relative z-10 rounded-3xl p-6 w-full max-w-md text-center">

    <!-- HEADER -->
    <h1 class="font-bold text-lg neon-text">LUKA-AI CYBER SYSTEM</h1>

    <!-- LOGO IMAGE -->
    <div class="flex justify-center mt-4">
      <img src="https://files.catbox.moe/1l02sd.png" class="avatar" />
    </div>

    <p class="text-xs text-purple-200 mt-2">✓ verify · deploy · log system</p>

    <!-- INPUT -->
    <div class="text-left mt-6">
      <label class="text-xs text-purple-300">GitHub Username</label>

      <input
        type="text"
        id="github-username"
        placeholder="e.g. Lucvoice"
        class="w-full mt-2 px-4 py-3 rounded-xl bg-white/10 border border-white/10 focus:outline-none focus:ring-2 focus:ring-purple-500 text-white"
      />
    </div>

    <!-- BUTTON -->
    <button
      onclick="handleDeploy()"
      class="w-full mt-6 py-3 rounded-full bg-gradient-to-r from-purple-600 to-indigo-500 font-bold hover:scale-105 transition glow"
    >
      🚀 VERIFY & DEPLOY
    </button>

    <!-- LOG PANEL -->
    <div class="mt-5 p-3 rounded-xl bg-white/5 border border-white/10 text-left">
      <p class="text-xs text-purple-300 mb-2">📡 SYSTEM LOG</p>

      <div id="log" class="text-xs text-purple-200 space-y-1">
        <div>🟣 System ready...</div>
        <div>⚡ Waiting for input...</div>
      </div>
    </div>

    <!-- FOOTER -->
    <p class="text-[10px] text-purple-300 mt-6 border-t border-white/10 pt-3">
      🛡️ CYBER LUKA-AI ACTIVE
    </p>

  </div>

  <script>
    function addLog(text) {
      const log = document.getElementById("log");
      const item = document.createElement("div");
      item.textContent = text;
      log.appendChild(item);
    }

    function handleDeploy() {
      const username = document.getElementById("github-username").value.trim();

      if (!username) {
        addLog("❌ No username entered");
        alert("Please enter GitHub username");
        return;
      }

      addLog("📡 Scanning GitHub profile...");
      addLog("🖼️ Loading system avatar...");

      // SHOW IMAGE LOG ENTRY
      const imgLog = document.createElement("div");
      imgLog.innerHTML = `
        <div style="margin-top:8px;">
          <img src="https://files.catbox.moe/1l02sd.png" width="80" style="border-radius:10px; border:1px solid #a855f7; box-shadow:0 0 10px #a855f7;" />
          <div>🔮 LUKA-AI Core Image Loaded</div>
        </div>
      `;
      document.getElementById("log").appendChild(imgLog);

      const url = `https://heroku.com/deploy?template=https://github.com/${username}/LUKA-AI`;
      window.open(url, "_blank");

      addLog("🚀 Deploy window opened");
    }
  </script>

</body>
</html>
