<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI • HEROKU</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      transition:0.3s;
      font-family:sans-serif;
    }

    body{
      background:#ffffff;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:15px;
    }

    body.dark{
      background:#0f172a;
    }

    .card{
      width:100%;
      max-width:360px;

      background:white;

      border-radius:30px;

      padding:22px;

      position:relative;

      border:1px solid #ede9fe;

      box-shadow:
      0 10px 30px rgba(139,92,246,0.12);
    }

    body.dark .card{
      background:#111827;
      color:white;
      border:1px solid #312e81;
    }

    .toggle{
      position:absolute;
      top:20px;
      right:20px;

      border:2px solid #8b5cf6;

      color:#8b5cf6;

      background:white;

      padding:8px 16px;

      border-radius:30px;

      font-weight:bold;

      cursor:pointer;
    }

    body.dark .toggle{
      background:#111827;
    }

    .logo{
      width:90px;
      height:90px;

      border-radius:50%;

      display:block;

      margin:auto;
      margin-top:40px;

      border:4px solid #8b5cf6;

      object-fit:cover;

      box-shadow:
      0 0 25px rgba(139,92,246,0.35);
    }

    .title{
      text-align:center;

      font-size:42px;

      font-weight:800;

      margin-top:15px;

      color:#6d28d9;
    }

    body.dark .title{
      color:white;
    }

    .sub{
      text-align:center;

      color:#6b7280;

      font-size:16px;
    }

    body.dark .sub{
      color:#9ca3af;
    }

    hr{
      margin:25px 0;

      border:none;

      height:1px;

      background:#ede9fe;
    }

    body.dark hr{
      background:#312e81;
    }

    .label{
      font-size:16px;

      font-weight:bold;

      margin-bottom:10px;

      display:flex;
      align-items:center;
      gap:10px;

      color:#6d28d9;
    }

    body.dark .label{
      color:white;
    }

    .input{
      width:100%;

      border:none;
      outline:none;

      background:#f5f3ff;

      padding:14px;

      border-radius:18px;

      font-size:15px;

      color:#111827;
    }

    .input:focus{
      box-shadow:
      0 0 0 3px rgba(139,92,246,0.2);
    }

    body.dark .input{
      background:#1f2937;
      color:white;
    }

    .fork{
      margin-top:15px;

      font-size:14px;

      color:#6b7280;

      display:flex;
      align-items:center;
      gap:8px;
    }

    .fork span{
      color:#8b5cf6;
      font-weight:bold;
    }

    .main-btn{
      width:100%;

      margin-top:20px;

      padding:16px;

      border-radius:40px;

      border:none;

      background:#8b5cf6;

      color:white;

      font-size:17px;

      font-weight:800;

      cursor:pointer;

      box-shadow:
      0 10px 25px rgba(139,92,246,0.3);
    }

    .main-btn:hover{
      transform:translateY(-2px);

      background:#7c3aed;
    }

    .github-box{
      margin-top:30px;

      background:#f5f3ff;

      border-radius:25px;

      padding:14px;

      display:flex;
      align-items:center;
      gap:10px;
    }

    body.dark .github-box{
      background:#1f2937;
    }

    .github-link{
      flex:1;

      background:white;

      padding:10px 15px;

      border-radius:25px;

      overflow:hidden;

      white-space:nowrap;

      text-overflow:ellipsis;

      font-size:14px;

      border:1px solid #ede9fe;
    }

    body.dark .github-link{
      background:#111827;
      border:1px solid #312e81;
    }

    .github-link a{
      color:#6d28d9;

      text-decoration:none;

      font-weight:bold;
    }

    body.dark .github-link a{
      color:white;
    }

    .footer{
      text-align:center;

      margin-top:20px;

      font-size:13px;

      color:#8b5cf6;
    }

    body.dark .footer{
      color:#9ca3af;
    }

  </style>
</head>
<body>

<div class="card">

  <button class="toggle" onclick="toggleDark()">
    <i class="fas fa-moon"></i> dark
  </button>

  <img
    src="https://files.catbox.moe/1l02sd.png"
    class="logo"
  >

  <div class="title">
    LUKA-AI
  </div>

  <div class="sub">
    ᴠᴇʀɪғʏ • ᴅᴇᴘʟᴏʏ • ʜᴇʀᴏᴋᴜ
  </div>

  <hr>

  <div class="label">
    <i class="fab fa-github"></i>
    GITHUB USERNAME
  </div>

  <input
    type="text"
    class="input"
    placeholder="e.g. lucvoice"
    id="username"
  >

  <div class="fork">
    <i class="fas fa-code-branch"></i>

    must fork

    <span>
      lucvoice/LUKA-AI
    </span>
  </div>

  <button
    class="main-btn"
    onclick="deploy()">

    🚀 VERIFY & DEPLOY TO HEROKU

  </button>

  <div class="github-box">

    <i class="fab fa-github fa-lg"></i>

    <div class="github-link">

      <a
      href="https://github.com/lucvoice/LUKA-AI"
      target="_blank">

      github.com/lucvoice/LUKA-AI

      </a>

    </div>

    <i class="fas fa-arrow-right"></i>

  </div>

  <hr>

  <div class="footer">
    🛡️ purple ui • dark mode • luka-ai
  </div>

</div>

<script>

  // DARK MODE

  function toggleDark(){

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
      localStorage.setItem("theme","dark");
    } else {
      localStorage.setItem("theme","light");
    }
  }

  // LOAD SAVED THEME

  if(localStorage.getItem("theme")==="dark"){
    document.body.classList.add("dark");
  }

  // DEPLOY BUTTON

  function deploy(){

    let user =
    document.getElementById("username").value;

    if(user===""){
      alert("Enter GitHub username");
      return;
    }

    window.open(
      "https://heroku.com/deploy?template=https://github.com/lucvoice/LUKA-AI",
      "_blank"
    );

  }

</script>

</body>
</html>
