<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI | ULTRA DEPLOY</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #3b0764, #0a0a12);
      overflow: hidden;
    }

    /* floating glow circles */
    .blob {
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(168,85,247,0.25);
      border-radius: 50%;
      filter: blur(80px);
      animation: float 8s infinite ease-in-out;
    }

    .blob2 {
      background: rgba(99,102,241,0.25);
      top: 60%;
      left: 60%;
      animation-delay: 2s;
    }

    .blob1 {
      top: 10%;
      left: 10%;
    }

    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(40px); }
    }

    .glass {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .glow {
      box-shadow: 0 0 25px rgba(168,85,247,0.6);
    }

    .neon {
      text-shadow: 0 0 12px rgba(168,85,247,0.9);
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 text-white">

  <!-- background blobs -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <!-- CARD -->
  <div class="glass glow rounded-3xl p-6 w-full max-w-md text-center relative z-10">

    <!-- header -->
    <div class="flex justify-between items-center mb-5">
      <h1 class="font-bold text-lg neon">LUKA-AI</h1>

      <button onclick="toggleDark()"
        class="text-xs px-3 py-1 rounded-full bg-purple-600 hover:bg-purple-500 transition">
        🌙 Mode
      </button>
    </div>

    <!-- logo -->
    <div class="flex justify-center mb-4">
      <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-black text-2xl glow animate-pulse">
        L
      </div>
    </div>

    <p class="text-purple-200 text-xs mb-6">
      ⚡ Verify • Deploy • Automate Heroku
    </p>

    <!-- input -->
    <div class="text-left">
      <label class="text-xs text-purple-300">GitHub Username</label>

      <input
        id="github-username"
        type="text"
        placeholder="e.g. lucvoice"
        class="w-full mt-2 px-4 py-3 rounded-xl bg-white/10 border border-white/10 focus:outline-none focus:ring-2 focus:ring-purple-500 text-white"
      />

      <p class="text-[11px] text-purple-300 mt-2">
        🌿 Fork required: <span class="text-purple-200 font-mono">LUKA-AI</span>
      </p>
    </div>

    <!-- button -->
    <button
      onclick="handleDeploy()"
      class="mt-6 w-full py-3 rounded-full bg-gradient-to-r from-purple-600 to-indigo-500 font-bold hover:scale-105 transition glow"
    >
      🚀 DEPLOY NOW
    </button>

    <!-- link -->
    <a
      href="https://github.com/lucvoice/LUKA-AI"
      target="_blank"
      class="mt-4 block text-xs text-purple-200 hover:text-white transition"
    >
      Open GitHub Repository →
    </a>

    <p class="text-[10px] text-purple-400 mt-6">
      🔐 Secure • Fast • AI Ready
    </p>

  </div>

  <script>
    function handleDeploy() {
      const username = document.getElementById("github-username").value.trim();

      if (!username) {
        alert("Weka GitHub username kwanza!");
        return;
      }

      const url = `https://heroku.com/deploy?template=https://github.com/${username}/LUKA-AI`;
      window.open(url, "_blank");
    }

    function toggleDark() {
      alert("Hii design tayari ni cyber-purple dark mode 😎");
    }
  </script>

</body>
</html>
