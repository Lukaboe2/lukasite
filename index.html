<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI | CYBER DEPLOY</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0b0014, #1a0033, #05010a);
      color: white;
    }

    .card {
      width: 340px;
      padding: 25px;
      border-radius: 15px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(187,0,255,0.3);
      box-shadow: 0 0 20px rgba(187,0,255,0.25);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      color: #bb00ff;
      letter-spacing: 2px;
    }

    p {
      font-size: 12px;
      color: #c9b3e6;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: rgba(0,0,0,0.4);
      color: white;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #bb00ff, #6a00ff);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    a {
      display: block;
      margin-top: 15px;
      font-size: 12px;
      color: #c9b3e6;
      text-decoration: none;
    }

    .status {
      margin-top: 15px;
      font-size: 10px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>LUKA-AI</h1>
    <p>Cyber Deploy System</p>

    <input id="github" type="text" placeholder="Enter GitHub username">

    <button onclick="deploy()">🚀 Deploy</button>

    <a href="https://github.com/lucvoice/LUKA-AI" target="_blank">
      Open Repository
    </a>

    <div class="status">SYSTEM ONLINE • READY</div>

  </div>

  <script>
    function deploy() {
      const user = document.getElementById("github").value.trim();

      if (!user) {
        alert("Please enter GitHub username");
        return;
      }

      const url = `https://heroku.com/deploy?template=https://github.com/${user}/LUKA-AI`;

      window.open(url, "_blank");
    }
  </script>

</body>
</html>
