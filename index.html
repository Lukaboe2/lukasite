<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI | CYBER GITHUB DASHBOARD</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #2e1065, #05010a);
    }

    .glass {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(168,85,247,0.25);
    }

    .glow {
      box-shadow: 0 0 25px rgba(168,85,247,0.35);
    }

    .neon-text {
      text-shadow: 0 0 12px rgba(168,85,247,0.8);
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(168,85,247,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168,85,247,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      opacity: 0.4;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid #a855f7;
      box-shadow: 0 0 15px rgba(168,85,247,0.6);
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 text-white relative">

  <div class="grid-bg"></div>

  <!-- MAIN CARD -->
  <div class="glass glow relative z-10 rounded-3xl p-6 w-full max-w-md text-center">

    <!-- TITLE -->
    <h1 class="font-bold text-lg neon-text">LUKA-AI CYBER DASHBOARD</h1>
    <p class="text-xs text-purple-200 mt-1">GitHub + Deploy + Live Log System</p>

    <!-- GITHUB SECTION -->
    <div class="mt-5 text-left p-3 rounded-xl bg-white/5 border border-white/10">

      <p class="text-xs text-purple-300 mb-2">🧑 GITHUB PROFILE</p>

      <input
        type="text"
        id="github-username"
        placeholder="Enter GitHub username"
        class="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/10 text-white text-sm focus:ring-2 focus:ring-purple-500"
      />

      <button
        onclick="loadGitHub()"
        class="w-full mt-3 py-2 rounded-lg bg-purple-600 hover:bg-purple-500 transition"
      >
        🔍 Load GitHub Profile
      </button>

      <!-- PROFILE DISPLAY -->
      <div id="profile" class="mt-4 text-xs text-purple-200"></div>

    </div>

    <!-- IMAGE LOG -->
    <div class="mt-4 flex justify-center">
      <img src="https://files.catbox.moe/1l02sd.png" class="avatar" />
    </div>

    <!-- LOG PANEL -->
    <div class="mt-5 p-3 rounded-xl bg-white/5 border border-white/10 text-left">
      <p class="text-xs text-purple-300 mb-2">📡 SYSTEM LOG</p>
      <div id="log" class="text-xs text-purple-200 space-y-1">
        <div>🟣 System initialized...</div>
      </div>
    </div>

    <!-- DEPLOY -->
    <button
      onclick="deploy()"
      class="w-full mt-5 py-3 rounded-full bg-gradient-to-r from-purple-600 to-indigo-500 font-bold hover:scale-105 transition glow"
    >
      🚀 VERIFY & DEPLOY
    </button>

    <!-- GITHUB LINK -->
    <a
      href="https://github.com/lucvoice/LUKA-AI"
      target="_blank"
      class="block mt-4 text-xs text-purple-200 hover:text-white"
    >
      🔗 Open Main Repository
    </a>

  </div>

  <script>
    function addLog(text) {
      const log = document.getElementById("log");
      const item = document.createElement("div");
      item.textContent = text;
      log.appendChild(item);
    }

    async function loadGitHub() {
      const user = document.getElementById("github-username").value.trim();
      const profile = document.getElementById("profile");

      if (!user) {
        addLog("❌ No GitHub username");
        return;
      }

      addLog("📡 Fetching GitHub data...");

      try {
        const res = await fetch(`https://api.github.com/users/${user}`);
        const data = await res.json();

        if (data.message === "Not Found") {
          profile.innerHTML = "❌ User not found";
          addLog("❌ GitHub user not found");
          return;
        }

        profile.innerHTML = `
          👤 Name: ${data.name || "No name"}<br>
          🔗 Username: ${data.login}<br>
          📦 Repos: ${data.public_repos}<br>
          ⭐ Followers: ${data.followers}<br>
          📍 Location: ${data.location || "Unknown"}<br>
          🔥 <a href="${data.html_url}" target="_blank" style="color:#a855f7;">Open Profile</a>
        `;

        addLog("✅ GitHub profile loaded");

      } catch (err) {
        addLog("⚠️ Error loading GitHub data");
      }
    }

    function deploy() {
      const user = document.getElementById("github-username").value.trim();

      if (!user) {
        addLog("❌ Enter username first");
        return;
      }

      addLog("🚀 Opening deploy window...");

      const url = `https://heroku.com/deploy?template=https://github.com/${user}/LUKA-AI`;
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
