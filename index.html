<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI • HEROKU</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    *{
      transition:0.3s;
      font-family:sans-serif;
    }

    body{
      background:#eef1f4;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:15px;
    }

    body.dark{
      background:#0f172a;
    }

    .card{
      width:100%;
      max-width:360px;
      background:white;
      border-radius:30px;
      padding:22px;
      box-shadow:0 10px 35px rgba(0,0,0,0.08);
      position:relative;
    }

    body.dark .card{
      background:#111827;
      color:white;
    }

    .toggle{
      position:absolute;
      top:20px;
      right:20px;
      border:2px solid #8b5cf6;
      color:#8b5cf6;
      background:none;
      padding:8px 16px;
      border-radius:30px;
      font-weight:bold;
      cursor:pointer;
    }

    .logo{
      width:90px;
      height:90px;
      border-radius:50%;
      display:block;
      margin:auto;
      margin-top:40px;
      border:4px solid #8b5cf6;
      object-fit:cover;
    }

    .title{
      text-align:center;
      font-size:42px;
      font-weight:800;
      margin-top:15px;
    }

    .sub{
      text-align:center;
      color:gray;
      font-size:16px;
    }

    hr{
      margin:25px 0;
      border:none;
      height:1px;
      background:#ddd;
    }

    .label{
      font-size:16px;
      font-weight:bold;
      margin-bottom:10px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .input{
      width:100%;
      border:none;
      outline:none;
      background:#f3f4f6;
      padding:14px;
      border-radius:18px;
      font-size:15px;
    }

    body.dark .input{
      background:#1f2937;
      color:white;
    }

    .fork{
      margin-top:15px;
      font-size:14px;
      color:gray;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .fork span{
      color:#8b5cf6;
      font-weight:bold;
    }

    .small-btn{
      width:100%;
      margin-top:15px;
      border:none;
      background:#ede9fe;
      color:#6d28d9;
      padding:12px;
      border-radius:20px;
      font-weight:bold;
      cursor:pointer;
    }

    .main-btn{
      width:100%;
      margin-top:18px;
      padding:16px;
      border-radius:40px;
      border:2px solid #8b5cf6;
      background:white;
      color:#6d28d9;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
    }

    .main-btn:hover{
      background:#8b5cf6;
      color:white;
    }

    body.dark .main-btn{
      background:#111827;
    }

    .github-box{
      margin-top:30px;
      background:#f5f3ff;
      border-radius:25px;
      padding:14px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    body.dark .github-box{
      background:#1f2937;
    }

    .github-link{
      flex:1;
      background:white;
      padding:10px 15px;
      border-radius:25px;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      font-size:14px;
    }

    body.dark .github-link{
      background:#111827;
    }

    .github-link a{
      color:#111827;
      text-decoration:none;
      font-weight:bold;
    }

    body.dark .github-link a{
      color:white;
    }

    .footer{
      text-align:center;
      margin-top:20px;
      font-size:13px;
      color:gray;
    }
  </style>
</head>
<body>

<div class="card">

  <button class="toggle" onclick="toggleDark()">
    <i class="fas fa-palette"></i> dark
  </button>

  <img src="https://i.imgur.com/8Km9tLL.jpg" class="logo">

  <div class="title">LUKA</div>

  <div class="sub">
    ✅ verify • deploy • heroku ☁️
  </div>

  <hr>

  <div class="label">
    <i class="fab fa-github"></i>
    GITHUB USERNAME
  </div>

  <input
    type="text"
    class="input"
    placeholder="e.g. lucvoice"
    id="username"
  >

  <div class="fork">
    <i class="fas fa-code-branch"></i>
    must fork
    <span>lucvoice/LUKA-AI</span>
  </div>

  <button class="small-btn">
    deploy via Heroku
  </button>

  <button class="main-btn" onclick="deploy()">
    🚀 VERIFY & DEPLOY TO HEROKU
  </button>

  <div class="github-box">

    <i class="fab fa-github fa-lg"></i>

    <div class="github-link">
      <a href="https://github.com/lucvoice/LUKA-AI"
         target="_blank">
         github.com/lucvoice/LUKA-AI
      </a>
    </div>

    <i class="fas fa-arrow-right"></i>

  </div>

  <hr>

  <div class="footer">
    🛡️ theme switch • purple success
  </div>

</div>

<script>
  function toggleDark(){
    document.body.classList.toggle("dark");
  }

  function deploy(){

    let user =
    document.getElementById("username").value;

    if(user === ""){
      alert("Enter GitHub username");
      return;
    }

    window.open(
      "https://heroku.com/deploy?template=https://github.com/lucvoice/LUKA-AI",
      "_blank"
    );
  }
</script>

</body>
</html>
